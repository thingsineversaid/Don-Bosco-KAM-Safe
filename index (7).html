<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123b55">
<title>DON BOSCO SAFE | Ruang Aman Sekolah</title>
<style>
:root{--navy:#123b55;--navy2:#1b526c;--teal:#159b91;--mint:#e9f7f4;--gold:#e9b85b;--bg:#f4f7fa;--ink:#203443;--muted:#718391;--line:#e3ebef;--white:#fff;--red:#d9534f;--orange:#d88a2d;--green:#26876d;--shadow:0 12px 34px rgba(20,55,75,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.wrap{max-width:1200px;margin:auto;padding:24px}.topbar{background:var(--navy);color:white;padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#28b3a5,#137d83);display:grid;place-items:center;font-weight:900;color:white;letter-spacing:-1px}.brand strong{display:block;letter-spacing:1.2px}.brand span{font-size:11px;color:#c7dbe3}.top-actions{display:flex;align-items:center;gap:10px}.pill{border:1px solid rgba(255,255,255,.22);border-radius:30px;padding:8px 12px;font-size:12px;color:#e5f0f3}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;transition:.2s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--teal);color:white}.dark{background:var(--navy);color:white}.light{background:#edf3f6;color:var(--navy)}.outline{background:white;border:1px solid var(--line);color:var(--navy)}.danger{background:#fff0ef;color:var(--red)}.gold{background:var(--gold);color:#49350d}.hero{background:linear-gradient(120deg,#123b55,#176b75);color:white;border-radius:22px;padding:34px;display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:center;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:7%;top:-130px;box-shadow:0 0 0 35px rgba(255,255,255,.035),0 0 0 70px rgba(255,255,255,.025)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#9fe4d8}.hero h1{font-size:clamp(28px,4vw,43px);line-height:1.1;margin:12px 0}.hero p{color:#d4e5e9;max-width:620px;line-height:1.7}.hero-art{position:relative;z-index:1;justify-self:center;text-align:center}.shield{width:145px;height:160px;margin:auto;display:grid;place-items:center;font-size:70px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);clip-path:polygon(50% 0,92% 15%,88% 65%,50% 100%,12% 65%,8% 15%)}.hero-art div:last-child{font-size:12px;color:#c9e2e5;margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:30px 0 14px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 3px 14px rgba(20,55,75,.025)}.feature{display:flex;gap:14px;align-items:flex-start}.feature-icon{width:45px;height:45px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:var(--mint)}.feature h3{font-size:15px;margin:1px 0 7px}.feature p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{border:1px solid #f0dfb9;background:#fff9eb;border-radius:13px;padding:13px 15px;color:#775a22;font-size:12px;line-height:1.6;margin-top:18px}.role-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.role{background:white;border:1px solid var(--line);border-radius:14px;padding:15px}.role b{display:block;font-size:13px;margin:8px 0 4px}.role span{font-size:11px;color:var(--muted);line-height:1.5}.role .emoji{font-size:22px}.footer{text-align:center;color:#8a9aa5;font-size:11px;padding:30px 0 15px}
.page{min-height:calc(100vh - 72px)}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:var(--shadow)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#435968}.field input,.field select,.field textarea{width:100%;border:1px solid #dce6eb;border-radius:10px;padding:12px;background:#fbfdfe;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #159b9118}.field textarea{min-height:110px;resize:vertical}.helper{font-size:11px;color:var(--muted);line-height:1.5}.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.page-title h1{font-size:25px;margin:0}.page-title p{font-size:12px;color:var(--muted);margin:5px 0 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:17px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:17px}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:6px;color:var(--navy)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;background:#fbfcfd}td strong{font-size:12px}.tag{display:inline-block;border-radius:30px;padding:5px 9px;font-size:10px;font-weight:800;background:#eef3f5;color:#536875}.tag.new{background:#fff1df;color:#a56b1c}.tag.review{background:#eaf2ff;color:#3e69a7}.tag.progress{background:#e7f6f1;color:#267b62}.tag.done{background:#edf0f2;color:#657680}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tab{padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:white;color:#536875;font-size:12px;font-weight:700}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}.login-box{max-width:450px;margin:55px auto}.login-box h1{margin:0 0 8px}.login-box p{color:var(--muted);font-size:13px;line-height:1.6}.chatbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fbfdfe}.chat-head{background:var(--navy);color:white;padding:14px 16px;font-size:13px;font-weight:700}.messages{padding:16px;min-height:250px;max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;padding:11px 13px;border-radius:13px;background:#edf3f6;font-size:12px;line-height:1.55}.bubble.mine{align-self:flex-end;background:#e3f5f1}.bubble small{display:block;color:#718391;font-size:10px;margin-bottom:4px}.sendrow{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.sendrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px}.empty{text-align:center;padding:34px;color:var(--muted);font-size:13px}.modal-back{position:fixed;inset:0;background:#102b3dbb;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:white;border-radius:18px;padding:23px;max-width:560px;width:100%;max-height:90vh;overflow:auto}.modal h2{margin-top:0}.close{float:right;border:0;background:#edf3f6;border-radius:8px;padding:6px 10px}.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:white;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:30;font-size:12px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero-art{display:none}.grid{grid-template-columns:1fr}.role-cards{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px}.topbar{padding:12px 16px}.pill{display:none}}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.role-cards{grid-template-columns:1fr 1fr}.page-title{align-items:flex-start;flex-direction:column}.hero{padding:25px}.top-actions .btn{padding:9px 11px;font-size:12px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">DB</div><div><strong>DON BOSCO SAFE</strong><span>Ruang Aman • Sekolah Aman • Masa Depan Aman</span></div></div>
  <div class="top-actions"><span class="pill">Yayasan Don Bosco • 89 Sekolah</span><button class="btn gold" onclick="showLogin()">Login Petugas</button></div>
</header>
<main id="app"></main>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const STORE='dbsafe_demo_v1';
const DEMO_USERS=[
 {username:'bk',password:'bk123',name:'Akun Guru BK',role:'bk',school:'SMA Don Bosco Medan'},
 {username:'wali',password:'wali123',name:'Akun Wali Kelas',role:'wali',school:'SMA Don Bosco Medan'},
 {username:'kepsek',password:'kepsek123',name:'Akun Kepala Sekolah',role:'kepsek',school:'SMA Don Bosco Medan'},
 {username:'admin',password:'admin123',name:'Admin Yayasan',role:'admin',school:'Yayasan Don Bosco'}
];
const seed=[
 {id:'DBS-2401',school:'SMA Don Bosco Medan',type:'Bullying verbal',date:'2026-11-15',location:'Koridor lantai 2',story:'Seorang siswa beberapa kali diejek dengan nama panggilan yang tidak disukai.',status:'Baru',priority:'Tinggi',reporter:'Anonim',messages:[{from:'Siswa anonim',text:'Saya takut masuk kelas karena sering diejek.',time:'15 Nov 2026'}]},
 {id:'DBS-2402',school:'SMP Don Bosco',type:'Perundungan sosial',date:'2026-11-14',location:'Ruang kelas',story:'Seorang siswa dikucilkan dari kelompok pertemanan.',status:'Ditinjau',priority:'Sedang',reporter:'Anonim',messages:[]},
 {id:'DBS-2403',school:'SD Don Bosco',type:'Kekerasan fisik',date:'2026-11-12',location:'Lapangan sekolah',story:'Ada laporan saling dorong saat jam istirahat. Perlu klarifikasi dan pendampingan.',status:'Ditangani',priority:'Tinggi',reporter:'Anonim',messages:[]}
];
function load(){try{return JSON.parse(localStorage.getItem(STORE))||{reports:seed,session:null}}catch(e){return {reports:seed,session:null}}}
let db=load(); if(!db.reports)db.reports=seed;
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
let activeReport=null;
const app=document.getElementById('app');
function toast(t){let r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>r.innerHTML='',2800)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function goHome(){db.session=null;save();renderHome()}
function renderHome(){app.innerHTML=`
<div class="wrap">
<section class="hero"><div><div class="eyebrow">YAYASAN DON BOSCO • SAFE SCHOOL INITIATIVE</div><h1>Setiap suara layak didengar.</h1><p>Ruang aman untuk menyampaikan kekhawatiran, melaporkan perundungan, dan mendapatkan pendampingan. Kamu tidak harus menghadapi semuanya sendirian.</p><div class="actions"><button class="btn gold" onclick="showReport()">✦ Buat Laporan Anonim</button><button class="btn" style="background:#ffffff18;color:white;border:1px solid #ffffff55" onclick="showRoomAccess()">Masuk Safe Room</button></div></div><div class="hero-art"><div class="shield">🛡️</div><div>AMAN • PEDULI • BERTINDAK</div></div></section>
<div class="section-head"><div><h2>Bagaimana kami bisa membantu?</h2><p>Pilih cara yang paling nyaman dan aman untukmu.</p></div></div>
<div class="grid">
 <div class="card feature"><div class="feature-icon">📝</div><div><h3>Anonymous Reporting</h3><p>Laporkan perundungan atau kejadian yang membuatmu merasa tidak aman. Kamu dapat mengirim laporan tanpa mengisi nama.</p><button class="btn primary" style="margin-top:13px" onclick="showReport()">Buat laporan</button></div></div>
 <div class="card feature"><div class="feature-icon">💬</div><div><h3>Anonymous Safe Room</h3><p>Berkomunikasi secara privat dengan petugas sekolah melalui kode laporan. Tidak ada ruang obrolan publik.</p><button class="btn light" style="margin-top:13px" onclick="showRoomAccess()">Buka Safe Room</button></div></div>
 <div class="card feature"><div class="feature-icon">🤝</div><div><h3>Pendampingan</h3><p>Guru BK dan wali kelas yang berwenang akan meninjau laporan dan membantu menentukan langkah aman berikutnya.</p><button class="btn light" style="margin-top:13px" onclick="showInfo()">Pelajari alurnya</button></div></div>
</div>
<div class="notice"><b>Jika kamu atau temanmu berada dalam bahaya sekarang:</b> segera cari orang dewasa tepercaya di sekolah atau hubungi layanan darurat setempat. Website ini bukan layanan darurat dan laporan demo tidak dipantau secara langsung.</div>
<div class="section-head"><div><h2>Untuk petugas sekolah dan yayasan</h2><p>Area kerja dengan akses sesuai peran.</p></div></div>
<div class="role-cards">
 <div class="role"><div class="emoji">🧑‍🏫</div><b>Guru BK</b><span>Meninjau laporan, memberi pendampingan, dan merespons pesan.</span></div>
 <div class="role"><div class="emoji">📘</div><b>Wali Kelas</b><span>Mendukung tindak lanjut sesuai kewenangan dan kebutuhan siswa.</span></div>
 <div class="role"><div class="emoji">🏫</div><b>Kepala Sekolah</b><span>Memantau status penanganan di sekolahnya.</span></div>
 <div class="role"><div class="emoji">🏛️</div><b>Admin Yayasan</b><span>Memantau statistik agregat lintas 89 sekolah.</span></div>
</div>
<div class="footer">DON BOSCO SAFE • Prototype demonstrasi • © Yayasan Don Bosco</div>
</div>`}
function showInfo(){modal(`<h2>Alur pelaporan yang aman</h2><ol style="font-size:13px;line-height:1.9;color:#536875"><li>Siswa mengirim laporan tanpa harus menuliskan identitas.</li><li>Sistem memberikan kode laporan untuk membuka percakapan.</li><li>Guru BK meninjau laporan dan menghubungi siswa melalui Safe Room.</li><li>Wali kelas dilibatkan bila relevan dan sesuai kebutuhan penanganan.</li><li>Kepala sekolah memantau progres sesuai kewenangan.</li></ol><div class="notice">Anonimitas pada prototype ini belum terjamin secara teknis. Jangan masukkan data pribadi atau kasus nyata sebelum backend, kontrol akses, dan kebijakan perlindungan data diterapkan.</div>`)}
function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button>${content}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function showReport(){modal(`<h2>Buat Laporan Anonim</h2><p class="muted small">Ceritakan apa yang terjadi. Nama tidak wajib diisi.</p><form id="reportForm" class="form-grid">
<div class="field"><label>Sekolah *</label><select name="school" required><option value="">Pilih sekolah</option>${schoolOptions()}</select></div>
<div class="field"><label>Jenis kejadian *</label><select name="type" required><option value="">Pilih jenis</option><option>Bullying verbal</option><option>Bullying fisik</option><option>Perundungan sosial</option><option>Cyberbullying</option><option>Pelecehan</option><option>Ancaman / intimidasi</option><option>Lainnya</option></select></div>
<div class="field"><label>Kapan terjadi?</label><input name="date" type="date"></div>
<div class="field"><label>Di mana terjadi?</label><input name="location" placeholder="Contoh: koridor, kelas, kantin"></div>
<div class="field"><label>Apakah kejadian masih berlangsung?</label><select name="ongoing"><option>Tidak tahu</option><option>Ya</option><option>Tidak</option></select></div>
<div class="field"><label>Seberapa mendesak?</label><select name="priority"><option>Belum yakin</option><option>Rendah</option><option>Sedang</option><option>Tinggi</option></select></div>
<div class="field full"><label>Ceritakan apa yang terjadi *</label><textarea name="story" required minlength="10" placeholder="Tuliskan kejadian, siapa yang terdampak (tanpa harus menyebut nama), dan hal yang menurutmu penting..."></textarea></div>
<div class="field full"><label>Nama (opsional)</label><input name="name" placeholder="Boleh dikosongkan untuk tetap anonim"></div>
<div class="field full"><label><input type="checkbox" required style="width:auto"> Saya memahami bahwa laporan ini akan ditinjau oleh petugas berwenang untuk membantu menjaga keselamatan siswa.</label></div>
<div class="field full"><div class="notice">Jangan unggah atau tuliskan informasi yang tidak diperlukan. Jika ada bahaya langsung, cari bantuan orang dewasa tepercaya sekarang.</div><button class="btn primary" type="submit">Kirim laporan anonim</button></div></form>`);
document.getElementById('reportForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),id='DBS-'+Math.floor(100000+Math.random()*899999),r={id,school:f.get('school'),type:f.get('type'),date:f.get('date')||new Date().toISOString().slice(0,10),location:f.get('location')||'Belum disebutkan',story:f.get('story'),status:'Baru',priority:f.get('priority'),reporter:f.get('name')||'Anonim',ongoing:f.get('ongoing'),messages:[]};db.reports.unshift(r);save();closeModal();modal(`<div style="text-align:center;padding:12px"><div style="font-size:42px">✓</div><h2>Laporan berhasil dibuat</h2><p class="muted small">Simpan kode berikut untuk membuka Safe Room dan melanjutkan komunikasi.</p><div style="font-size:26px;font-weight:900;letter-spacing:2px;color:#159b91;background:#e9f7f4;padding:16px;border-radius:12px">${id}</div><p class="small muted">Kode ini hanya contoh di prototype. Simpan secara pribadi dan jangan bagikan kepada orang lain.</p><button class="btn primary" onclick="closeModal();showRoomWithCode('${id}')">Buka Safe Room</button></div>`);}}
}
function schoolOptions(){return ['SMA Don Bosco Medan','SMP Don Bosco','SD Don Bosco','TK Don Bosco','SMA Don Bosco lainnya','Sekolah Don Bosco lainnya'].map(s=>`<option>${s}</option>`).join('')}
function showRoomAccess(){modal(`<h2>Masuk Anonymous Safe Room</h2><p class="muted small">Masukkan kode laporan yang kamu terima setelah mengirim laporan.</p><form id="roomForm"><div class="field"><label>Kode laporan</label><input name="code" placeholder="Contoh: DBS-123456" required></div><button class="btn primary" style="margin-top:15px">Masuk Safe Room</button></form><div class="notice">Jika belum memiliki kode, buat laporan terlebih dahulu. Jangan masukkan kode orang lain.</div>`);document.getElementById('roomForm').onsubmit=e=>{e.preventDefault();let code=new FormData(e.target).get('code').trim().toUpperCase();closeModal();showRoomWithCode(code)}}
function showRoomWithCode(code){let r=db.reports.find(x=>x.id.toUpperCase()===code.toUpperCase());if(!r){toast('Kode laporan tidak ditemukan di data demo.');return}activeReport=r.id;app.innerHTML=`<div class="wrap page"><div class="page-title"><div><h1>Anonymous Safe Room</h1><p>Ruang komunikasi privat untuk laporan <b>${esc(r.id)}</b></p></div><button class="btn light" onclick="renderHome()">← Kembali</button></div><div class="panel"><div class="chatbox"><div class="chat-head">🔒 Percakapan laporan ${esc(r.id)} • ${esc(r.school)}</div><div class="messages" id="messages">${r.messages.length?r.messages.map(m=>`<div class="bubble ${m.from==='Siswa anonim'?'mine':''}"><small>${esc(m.from)} • ${esc(m.time)}</small>${esc(m.text)}</div>`).join(''):'<div class="empty">Belum ada pesan. Kamu bisa menuliskan hal yang ingin disampaikan kepada petugas.</div>'}</div><form class="sendrow" id="chatForm"><input name="text" placeholder="Tulis pesan dengan sopan..." required><button class="btn primary">Kirim</button></form></div><div class="notice">Percakapan pada prototype ini hanya tersimpan di browser yang digunakan. Ini bukan chat online sungguhan dan belum dapat dibaca petugas dari perangkat lain.</div></div></div>`;document.getElementById('chatForm').onsubmit=e=>{e.preventDefault();let t=new FormData(e.target).get('text').trim();if(!t)return;r.messages.push({from:'Siswa anonim',text:t,time:new Date().toLocaleString('id-ID')});save();showRoomWithCode(r.id)}}
function showLogin(){modal(`<div class="login-box" style="margin:0"><h1>Login Petugas</h1><p>Masuk ke ruang kerja sesuai peran dan kewenangan.</p><form id="loginForm" class="form-grid"><div class="field full"><label>Username</label><input name="username" required placeholder="Masukkan username"></div><div class="field full"><label>Password</label><input name="password" type="password" required placeholder="Masukkan password"></div><div class="field full"><button class="btn primary">Login</button></div></form><div class="notice"><b>Akun demo:</b><br>Guru BK: bk / bk123<br>Wali Kelas: wali / wali123<br>Kepala Sekolah: kepsek / kepsek123<br>Admin Yayasan: admin / admin123</div></div>`);document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),u=DEMO_USERS.find(x=>x.username===f.get('username')&&x.password===f.get('password'));if(!u){toast('Username atau password demo salah.');return}db.session=u;save();closeModal();renderDashboard()}}
function renderDashboard(){let u=db.session;if(!u){renderHome();return}let list=db.reports.filter(r=>u.role==='admin'||r.school===u.school);let counts={baru:list.filter(r=>r.status==='Baru').length,review:list.filter(r=>r.status==='Ditinjau').length,progress:list.filter(r=>r.status==='Ditangani').length,done:list.filter(r=>r.status==='Selesai').length};let roleLabel={bk:'Guru BK',wali:'Wali Kelas',kepsek:'Kepala Sekolah',admin:'Admin Yayasan'}[u.role];app.innerHTML=`<div class="wrap page"><div class="page-title"><div><div class="eyebrow" style="color:#159b91">RUANG KERJA PETUGAS</div><h1>Selamat datang, ${esc(u.name)}</h1><p>${roleLabel} • ${esc(u.school)}</p></div><button class="btn light" onclick="goHome()">Keluar</button></div>
${u.role==='admin'?`<div class="notice" style="margin:0 0 16px">Dashboard yayasan menampilkan data demo lintas sekolah. Pada sistem nyata, akses detail kasus harus dibatasi dan statistik pusat sebaiknya diagregasi.</div>`:''}
<div class="stats"><div class="stat"><span>Total laporan</span><strong>${list.length}</strong></div><div class="stat"><span>Baru</span><strong>${counts.baru}</strong></div><div class="stat"><span>Sedang ditinjau</span><strong>${counts.review}</strong></div><div class="stat"><span>Selesai</span><strong>${counts.done}</strong></div></div>
${u.role==='admin'?`<div class="panel" style="margin-bottom:16px"><h3 style="margin-top:0">Monitoring Yayasan</h3><div class="grid"><div><div class="muted small">Sekolah dalam cakupan</div><strong style="font-size:25px">89</strong></div><div><div class="muted small">Laporan pada prototype</div><strong style="font-size:25px">${db.reports.length}</strong></div><div><div class="muted small">Perlu perhatian (tinggi)</div><strong style="font-size:25px">${db.reports.filter(x=>x.priority==='Tinggi').length}</strong></div></div></div>`:''}
<div class="panel"><div class="page-title"><div><h2 style="font-size:18px;margin:0">Daftar laporan</h2><p>Data simulasi untuk demonstrasi alur kerja.</p></div><button class="btn outline" onclick="renderDashboard()">↻ Muat ulang</button></div><div class="tabs"><button class="tab active" onclick="filterReports('Semua',this)">Semua</button><button class="tab" onclick="filterReports('Baru',this)">Baru</button><button class="tab" onclick="filterReports('Ditinjau',this)">Ditinjau</button><button class="tab" onclick="filterReports('Ditangani',this)">Ditangani</button><button class="tab" onclick="filterReports('Selesai',this)">Selesai</button></div><div class="table-wrap"><table><thead><tr><th>Kode / Sekolah</th><th>Jenis kejadian</th><th>Tanggal</th><th>Prioritas</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="reportRows">${rows(list)}</tbody></table></div></div><div class="footer">DON BOSCO SAFE • Prototype demonstrasi • Data tersimpan lokal pada browser ini</div></div>`}
function rows(list){if(!list.length)return '<tr><td colspan="6" class="empty">Belum ada laporan.</td></tr>';return list.map(r=>`<tr><td><strong>${esc(r.id)}</strong><br><span class="muted small">${esc(r.school)}</span></td><td>${esc(r.type)}</td><td>${esc(r.date)}</td><td><span class="tag ${r.priority==='Tinggi'?'new':''}">${esc(r.priority)}</span></td><td><span class="tag ${r.status==='Baru'?'new':r.status==='Ditinjau'?'review':r.status==='Ditangani'?'progress':'done'}">${esc(r.status)}</span></td><td><button class="btn light" style="padding:7px 10px" onclick="showCase('${r.id}')">Lihat</button></td></tr>`).join('')}
function filterReports(status,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');let u=db.session,l=db.reports.filter(r=>u.role==='admin'||r.school===u.school);if(status!=='Semua')l=l.filter(r=>r.status===status);document.getElementById('reportRows').innerHTML=rows(l)}
function showCase(id){let r=db.reports.find(x=>x.id===id);if(!r)return;let canEdit=db.session.role==='bk'||db.session.role==='wali'||db.session.role==='admin';modal(`<h2>Detail laporan ${esc(r.id)}</h2><div class="small muted">${esc(r.school)} • ${esc(r.date)}</div><div style="margin:15px 0;display:grid;gap:9px;font-size:13px"><div><b>Jenis:</b> ${esc(r.type)}</div><div><b>Lokasi:</b> ${esc(r.location)}</div><div><b>Pelapor:</b> ${esc(r.reporter)}</div><div><b>Prioritas:</b> ${esc(r.priority)}</div><div><b>Status:</b> ${esc(r.status)}</div><div><b>Kronologi:</b><br>${esc(r.story)}</div></div><hr style="border:0;border-top:1px solid #e3ebef"><h3 style="font-size:14px">Pesan Safe Room (${r.messages.length})</h3>${r.messages.length?r.messages.map(m=>`<div class="bubble" style="margin:7px 0"><small>${esc(m.from)} • ${esc(m.time)}</small>${esc(m.text)}</div>`).join(''):'<p class="small muted">Belum ada pesan.</p>'}${canEdit?`<div class="field" style="margin-top:15px"><label>Perbarui status</label><select id="statusEdit">${['Baru','Ditinjau','Ditangani','Selesai'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Balas melalui Safe Room</label><textarea id="replyText" placeholder="Tulis respons yang suportif dan tidak menyalahkan..."></textarea></div><button class="btn primary" style="margin-top:12px" onclick="updateCase('${r.id}')">Simpan perubahan</button>`:''}<div class="notice">Gunakan pendekatan yang tidak menyalahkan korban. Hindari menjanjikan kerahasiaan mutlak; jelaskan batas kerahasiaan jika keselamatan siswa terancam.</div>`)}
function updateCase(id){let r=db.reports.find(x=>x.id===id);r.status=document.getElementById('statusEdit').value;let msg=document.getElementById('replyText').value.trim();if(msg)r.messages.push({from:db.session.role==='wali'?'Wali Kelas':db.session.role==='bk'?'Guru BK':'Admin Yayasan',text:msg,time:new Date().toLocaleString('id-ID')});save();closeModal();renderDashboard();toast('Perubahan tersimpan pada browser ini.')}
if(db.session)renderDashboard();else renderHome();
</script>
</body>
</html>
